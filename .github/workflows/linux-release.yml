name: Linux build and release

# Builds only the 32-bit cloud_redirect.so that hooks Steam on Linux (Steam is
# 32-bit; built against glibc 2.31 like upstream) and, for vX.Y.Z[.N] tags,
# attaches it plus its bare sha256 to the GitHub release created by the Windows
# workflow. The Flatpak/UI/Pages pipeline from upstream is not maintained in
# this fork at all.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native 32-bit (Ubuntu 20.04, glibc 2.31)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install the toolchain (GCC 12 multilib from the toolchain PPA, CMake from pip)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          apt-get update
          # perl: OpenSSL's Configure needs the full module set, not just perl-base.
          apt-get install -y --no-install-recommends software-properties-common ca-certificates gnupg git curl file binutils make perl python3-pip
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          # The unversioned multilib packages also provide the i386 asm/ kernel headers
          # (asm/errno.h) that a -m32 build needs.
          apt-get install -y --no-install-recommends gcc-multilib g++-multilib gcc-12 g++-12 gcc-12-multilib g++-12-multilib
          pip3 install --no-cache-dir 'cmake>=3.20'
          cmake --version | head -1
          gcc-12 --version | head -1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set release version from tag (not committed)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag='${{ github.ref_name }}'
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo "Tag '$tag' must look like vX.Y.Z (upstream version) or vX.Y.Z.N (fork revision)"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          sed -i "s|<ReleaseVersion>[^<]*</ReleaseVersion>|<ReleaseVersion>$version</ReleaseVersion>|" Version.props
          echo "ReleaseVersion set to $version"

      # Since 2.6.6 the .so links libcurl and OpenSSL statically from deps/install32
      # (CMakeLists.txt), which upstream builds outside the repo. Build them here:
      # current patch releases, configured like upstream's .so (no zlib, HTTP/2,
      # PSL or IDN, so the only runtime dependencies stay libc/libstdc++).
      - name: Cache static 32-bit OpenSSL and libcurl
        id: deps32
        uses: actions/cache@v4
        with:
          path: deps/install32
          key: deps32-ubuntu20.04-gcc12-openssl-3.5.9-curl-8.22.0-v1

      - name: Build static 32-bit OpenSSL and libcurl into deps/install32
        if: steps.deps32.outputs.cache-hit != 'true'
        env:
          OPENSSL_VERSION: 3.5.9
          OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          CURL_VERSION: 8.22.0
          CURL_SHA256: d54dd598bf05927a726deb38df31c6a255ba83ff1de57c5d1464dac3ed8f44a1
        run: |
          set -e
          prefix="$PWD/deps/install32"
          work=$(mktemp -d)
          cd "$work"
          curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl-$OPENSSL_VERSION.tar.gz" | sha256sum -c -
          curl -fsSLO "https://curl.se/download/curl-$CURL_VERSION.tar.gz"
          echo "$CURL_SHA256  curl-$CURL_VERSION.tar.gz" | sha256sum -c -

          tar xzf "openssl-$OPENSSL_VERSION.tar.gz"
          cd "openssl-$OPENSSL_VERSION"
          # -fPIC: these archives end up inside a shared object.
          CC=gcc-12 ./Configure linux-x86 -m32 -fPIC no-shared no-tests \
            --prefix="$prefix" --libdir=lib --openssldir="$prefix/ssl"
          make -j"$(nproc)" build_libs
          make install_dev
          cd ..

          tar xzf "curl-$CURL_VERSION.tar.gz"
          cd "curl-$CURL_VERSION"
          CC=gcc-12 CFLAGS="-m32 -fPIC -O2" LDFLAGS="-m32" LIBS="-ldl -pthread" \
            ./configure --build=x86_64-pc-linux-gnu --host=i686-pc-linux-gnu \
              --prefix="$prefix" --libdir="$prefix/lib" \
              --disable-shared --enable-static --with-pic --with-openssl="$prefix" \
              --without-zlib --without-brotli --without-zstd --without-libpsl --without-libidn2 \
              --without-nghttp2 --without-libssh2 --without-librtmp \
              --disable-ldap --disable-ldaps --disable-manual --disable-docs
          make -j"$(nproc)" -C lib
          make -C lib install
          make -C include install
          ls -l "$prefix/lib"

      - name: Build 32-bit cloud_redirect.so
        run: |
          set -e
          sha=$(echo '${{ github.sha }}' | cut -c1-7)
          cmake -S . -B build-linux32 -DCMAKE_BUILD_TYPE=Release -DLINUX_32BIT=ON \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 "-DCR_GIT_SHA=$sha"
          cmake --build build-linux32 --target cloud_redirect -j"$(nproc)"

      - name: Verify the binaries are 32-bit and report their glibc requirement
        run: |
          set -e
          f=build-linux32/cloud_redirect.so
          file "$f"
          file "$f" | grep -q 'ELF 32-bit' || { echo "$f is not a 32-bit ELF"; exit 1; }
          echo "$f: newest glibc symbol version $(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          # The static OpenSSL assembly must not leave text relocations behind.
          if readelf -d "$f" | grep -q TEXTREL; then echo "$f has text relocations"; exit 1; fi
          readelf -d "$f" | grep NEEDED

      - name: Run 32-bit StoreStats hook compatibility regression
        run: |
          set -e
          cmake --build build-linux32 --target stats_store_hook_tests autocloud_injection_tests pending_ops_journal_tests trash_util_tests -j"$(nproc)"
          ctest --test-dir build-linux32 -R '^(stats_store_hook_tests|autocloud_injection_tests|pending_ops_journal_tests|trash_util_tests)$' --output-on-failure

      - name: Build and run fork unit tests (64-bit host build of the shared code)
        run: |
          set -e
          sha=$(echo '${{ github.sha }}' | cut -c1-7)
          cmake -S . -B build-linux64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 "-DCR_GIT_SHA=$sha"
          cmake --build build-linux64 --target stats_store_fork_tests autocloud_injection_tests steam_message_layout_tests pending_ops_journal_tests trash_util_tests -j"$(nproc)"
          ctest --test-dir build-linux64 -R '^(stats_store_fork_tests|autocloud_injection_tests|steam_message_layout_tests|pending_ops_journal_tests|trash_util_tests)$' --output-on-failure

      - name: Upload native binaries
        uses: actions/upload-artifact@v5
        with:
          name: linux-native
          path: build-linux32/cloud_redirect.so
          if-no-files-found: error

  publish:
    name: Attach Linux assets to the release
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v5
        with:
          name: linux-native
          path: out

      - name: Collect release assets with bare sha256 files
        run: |
          set -e
          mkdir -p dist
          cp out/cloud_redirect.so dist/
          cd dist
          for f in *; do sha256sum "$f" | cut -d' ' -f1 | tr -d '\n' > "$f.sha256"; done
          ls -l

      - name: Attach the Linux assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag='${{ github.ref_name }}'
          # The Windows workflow creates the release for the same tag; wait for it
          # instead of racing it (it takes a few minutes longer than nothing).
          for i in $(seq 1 60); do
            gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1 && break
            [ "$i" -lt 60 ] || { echo "Release $tag did not appear after 20 minutes; the assets are still available as workflow artifacts"; exit 1; }
            sleep 20
          done
          gh release upload "$tag" dist/* --repo '${{ github.repository }}' --clobber
          gh release view "$tag" --repo '${{ github.repository }}' --json assets --jq '.assets[].name'
