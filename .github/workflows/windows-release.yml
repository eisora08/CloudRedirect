name: Windows build and release

# Builds only the native x64 cloud_redirect.dll and the cr_compat_check
# reporter with MSVC and, for vX.Y.Z[.N] tags, creates/updates a GitHub release
# with both binaries and their bare sha256. The UI/steam_api bundling from
# upstream is intentionally not built here: consumers (e.g. OpenSteamTool)
# host the DLL directly.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Upstream builds with Visual Studio 2022 (MSVC 14.44, toolset v143). Pin the
  # same toolset so the native binaries keep the same VC++ Redistributable
  # requirement instead of silently needing the newer runtime that ships with
  # the VS 2026 toolset on windows-latest.
  MSVC_TOOLSET: v143

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set release version from tag (not committed)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not ($tag -match '^v(\d+\.\d+\.\d+(\.\d+)?)$')) {
            throw "Tag '$tag' must look like vX.Y.Z (upstream version) or vX.Y.Z.N (fork revision)"
          }
          $version = $Matches[1]
          $props = Get-Content Version.props -Raw
          $props = $props -replace '<ReleaseVersion>[^<]*</ReleaseVersion>', "<ReleaseVersion>$version</ReleaseVersion>"
          Set-Content Version.props -Value $props -NoNewline
          Write-Host "ReleaseVersion set to $version"

      - name: Detect Visual Studio generator
        id: vs
        shell: pwsh
        run: |
          # windows-latest moved from VS 2022 to VS 2026, so ask vswhere instead of hard-coding "Visual Studio 17 2022".
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $vs) { throw 'No Visual Studio instance with the C++ x86/x64 toolchain was found' }
          $major = [int]$vs[0].installationVersion.Split('.')[0]
          # Let CMake supply the exact generator name for that major (e.g. "Visual Studio 18 2026").
          $generator = (cmake --help | Select-String -Pattern "Visual Studio $major \d{4}" | Select-Object -First 1).Matches[0].Value
          if (-not $generator) { throw "CMake does not know a Visual Studio $major generator" }
          Write-Host "Using '$generator' from $($vs[0].installationPath)"
          "generator=$generator" >> $env:GITHUB_OUTPUT

      - name: Build native x64 cloud_redirect.dll
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'.Substring(0, 7)
          cmake -S . -B build -G "${{ steps.vs.outputs.generator }}" -A x64 -T $env:MSVC_TOOLSET "-DCR_GIT_SHA=$sha"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target cloud_redirect cr_compat_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build and run fork unit tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target stats_store_fork_tests autocloud_injection_tests steam_message_layout_tests steam_resolver_tests compat_tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/Release/stats_store_fork_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/Release/autocloud_injection_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/Release/steam_message_layout_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/Release/steam_resolver_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/Release/compat_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/cloud_redirect.dll dist/
          Copy-Item build/Release/cr_compat_check.exe dist/
          foreach ($f in Get-ChildItem dist -File) {
            # Bare hash only: the in-app updater ignores .sha256 files that are not exactly 64 characters.
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($f.FullName).sha256" -Value $h -NoNewline
          }
          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          (Get-Item dist/cloud_redirect.dll).VersionInfo | Format-List FileVersion, ProductVersion

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: CloudRedirect-windows-${{ github.sha }}
          path: dist/*

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # git writes "fatal: no tag exactly matches..." to stderr when this
          # is the first release; don't let the default ErrorActionPreference
          # turn that into a step failure.
          $ErrorActionPreference = 'Continue'
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          # Previous reachable tag (history is linear on master).
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("What's Changed")
          $lines.Add("")
          if ($LASTEXITCODE -eq 0 -and $prev) {
              $prev = "$prev".Trim()
              git log --oneline --no-decorate "$prev..$tag" | ForEach-Object { $lines.Add("$_") }
              $lines.Add("")
              $lines.Add("Full Changelog: https://github.com/$repo/compare/$prev...$tag")
          } else {
              git log --oneline --no-decorate "$tag" | ForEach-Object { $lines.Add("$_") }
          }
          $lines | Set-Content -Path release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content release-notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
