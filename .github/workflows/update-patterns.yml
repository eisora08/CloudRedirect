name: Update patterns

# Generates the per-build pattern file ([[patterns]] TOML, first-match
# verified .text captures -- GetAppInfo, FlushAppMinutesPlayed and the rest
# of the critical set) for the runner's CURRENT Steam build and reports the
# compat verdict as a workflow notice.
#
# Publishing is MANUAL (maintainer's PC -> steam-monitor 'pattern-cloud'
# branch, which holds ONLY patterns/<sha>.toml). This workflow used to push
# to a 'pattern' branch in this repository, which forced the whole repo tree
# onto that branch and has been removed.
#
# NOTE: steam-monitor's mirrored 'pattern' branch is unusable as a feed:
# mirror.yml force-replaces its tree every 10 min from an upstream that
# serves a different format/content set.

on:
  workflow_dispatch:
  schedule:
    # Daily: Steam updates happen on Valve's schedule, not on ours. The
    # push trigger alone would never cover a new client build that lands
    # without any code change here.
    - cron: "17 6 * * *"
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'

# Read-only: this workflow no longer pushes (pattern publishing is manual).
permissions:
  contents: read

jobs:
  update-patterns:
    name: Generate & push pattern for new Steam build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (with write token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          # No -G: the runner image's VS major version changes (17, 18, ...),
          # let CMake pick the newest installed generator; -A pins x64.
          cmake -S . -B build -A x64

      - name: Build cr_compat_check
        run: cmake --build build --config Release --target cr_compat_check

      # GitHub-hosted Windows runners do NOT ship Steam and the SteamSetup
      # bootstrapper does not complete silently in this sandbox, so this
      # step only LOCATES an existing Steam install (none on the hosted
      # image) and gracefully skips when absent. Pattern generation for new
      # builds happens on the maintainer's PC via scripts/CompatAhora.bat.
      - name: Ensure runner Steam client (install/update, best effort)
        id: ensure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            ${env:ProgramFiles(x86)} + "\Steam",
            $env:ProgramFiles + "\Steam",
            "C:\Steam"
          )
          $steamDir = $candidates | Where-Object { Test-Path "$_\steamclient64.dll" } | Select-Object -First 1

          if (-not $steamDir) {
            # GitHub-hosted Windows runners do NOT ship Steam and the
            # SteamSetup bootstrapper does not complete silently in this
            # sandbox, so CI cannot obtain a current steamclient64.dll on
            # its own. Pattern generation happens on the maintainer's PC via
            # scripts/CompatAhora.bat; this workflow gracefully skips.
            Write-Host "::notice::Steam not present on this runner image; skipping this run"
            echo "present=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $dll = "$steamDir\steamclient64.dll"
          $manifest = "$steamDir\package\steam_client_win64.manifest"
          try {
            Start-Process "$steamDir\steam.exe" -ArgumentList '-silent'
          } catch {
            Write-Host "::warning::could not launch steam.exe: $_"
          }
          # Wait (bounded) until the DLL and package manifest both stop
          # changing: the client is then on its current stable build.
          $deadline = (Get-Date).AddMinutes(15)
          $seen = $null
          $stableSince = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            if (-not (Test-Path $dll)) { continue }
            try {
              $sig = (Get-Item $dll).LastWriteTimeUtc.Ticks
              $sig = "$sig/" + $(if (Test-Path $manifest) { (Get-Item $manifest).LastWriteTimeUtc.Ticks } else { 0 })
            } catch { continue }
            if ($sig -ne $seen) {
              $seen = $sig
              $stableSince = $null
              Write-Host "client files still changing; waiting for the update to settle"
              continue
            }
            if (-not $stableSince) { $stableSince = Get-Date; continue }
            if (((Get-Date) - $stableSince).TotalSeconds -ge 60) { break }
          }
          Get-Process steam -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          if (-not (Test-Path $dll)) {
            Write-Host "::warning::steamclient64.dll never appeared after install/bootstrap; skipping"
            echo "present=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          echo "present=true" >> $env:GITHUB_OUTPUT
          echo "dir=$steamDir" >> $env:GITHUB_OUTPUT
          Write-Host "Using $dll"

      - name: Determine Steam client DLL
        id: steam
        if: steps.ensure.outputs.present == 'true'
        shell: pwsh
        run: |
          $steamDir = "${{ steps.ensure.outputs.dir }}"
          if (-not (Test-Path "$steamDir\steamclient64.dll")) {
            Write-Error "steamclient64.dll not found at $steamDir"
            exit 1
          }
          $dll = "$steamDir\steamclient64.dll"
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          $ver = 0
          $manifest = "$steamDir\package\steam_client_win64.manifest"
          if (Test-Path $manifest) {
            $ver = [int64]((Get-Content $manifest -Raw) -match '"version"\s+"(\d+)"' | Out-Null; $matches[1])
          }
          Write-Output "dll=$dll"
          Write-Output "sha=$sha"
          Write-Output "ver=$ver"
          echo "dll=$dll" >> $env:GITHUB_OUTPUT
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Run compat check
        id: check
        if: steps.ensure.outputs.present == 'true'
        shell: pwsh
        run: |
          $dll = "${{ steps.steam.outputs.dll }}"
          $sha = "${{ steps.steam.outputs.sha }}"
          $ver = "${{ steps.steam.outputs.ver }}"
          $outJson = "compat_${sha}.json"
          $patFile = "pattern_${sha}.toml"
          .\build\Release\cr_compat_check.exe --dll $dll --out $outJson --channel stable --version $ver --emit-patterns $patFile
          $code = $LASTEXITCODE
          $report = Get-Content $outJson -Raw | ConvertFrom-Json
          echo "status=$($report.status)" >> $env:GITHUB_OUTPUT
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "patFile=$patFile" >> $env:GITHUB_OUTPUT
          exit $code

      - name: Report generated pattern (publishing is manual)
        if: steps.check.outputs.status == 'full'
        shell: pwsh
        run: |
          $sha = "${{ steps.check.outputs.sha }}"
          $patFile = "${{ steps.check.outputs.patFile }}"
          Write-Host "::notice::Pattern generated for $sha ($patFile)."
          Write-Host "Publish manually: copy it to steam-monitor's pattern-cloud branch as patterns/$sha.toml"
          if (Test-Path $patFile) { Get-Content $patFile -Raw | Write-Host }

      - name: Notice when nothing was published
        if: steps.ensure.outputs.present == 'true' && steps.check.outputs.status != 'full'
        shell: pwsh
        run: Write-Host "::notice::compat status is not 'full' for this build; pattern not generated"
